name: basic checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r pentest-workbench/requirements.txt

      - name: Syntax
        run: |
          python -m py_compile network-scanner/scanner.py
          python -m py_compile packet-analyzer/analyzer.py
          python -m py_compile log-analyzer/analyzer.py
          python -m py_compile file-integrity-monitor/monitor.py
          python -m py_compile http-security-checker/check_headers.py
          python -m py_compile nmap-result-explorer/nmap_explorer.py
          python -m py_compile web-endpoint-inventory/endpoint_inventory.py
          python -m py_compile ctf-toolbox/toolbox.py
          python -m py_compile wordlist-lab/wordlist_lab.py
          python -m py_compile evidence-organizer/evidence.py
          python -m py_compile system-hardening-auditor/hardening_audit.py
          python -m py_compile socket-leak-guard/socket_leak_guard.py
          python -m py_compile exposure-management/exposure.py
          python -m py_compile exposure-management/exposure_manager/models.py
          python -m py_compile exposure-management/exposure_manager/scoring.py
          python -m py_compile exposure-management/exposure_manager/database.py
          python -m py_compile exposure-management/exposure_manager/importers.py
          python -m py_compile exposure-management/exposure_manager/service.py
          python -m py_compile exposure-management/exposure_manager/reporting.py
          python -m py_compile exposure-management/exposure_manager/analytics.py
          python -m py_compile exposure-management/exposure_manager/intel.py
          python -m py_compile exposure-management/exposure_manager/campaigns.py
          python -m py_compile exposure-management/exposure_manager/integrations.py
          python -m py_compile exposure-management/exposure_manager/assets.py
          python -m py_compile pentest-workbench/app.py
          python -m py_compile pentest-workbench/ptworkbench/tools.py

      - name: Tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s pentest-workbench/tests -v
          python -m unittest discover -s system-hardening-auditor/tests -v
          python -m unittest discover -s socket-leak-guard/tests -v
          python -m unittest discover -s exposure-management/tests -v

      - name: Workbench smoke test
        env:
          PTW_DB: /tmp/workbench-smoke.db
        run: |
          python -c "import sys; sys.path.insert(0, 'pentest-workbench'); import app; client=app.app.test_client(); response=client.get('/'); print(app.app.url_map); print('HTTP', response.status_code); assert response.status_code == 200"
