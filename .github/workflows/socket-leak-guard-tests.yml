name: Socket Leak Guard Tests

on:
  push:
    paths:
      - "socket-leak-guard/**"
      - ".github/workflows/socket-leak-guard-tests.yml"
  pull_request:
    paths:
      - "socket-leak-guard/**"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r socket-leak-guard/requirements.txt
      - name: Syntax check
        run: python -m py_compile socket-leak-guard/socket_leak_guard.py
      - name: Unit tests
        run: python -m unittest discover -s socket-leak-guard/tests -v
      - name: CLI help smoke test
        run: python socket-leak-guard/socket_leak_guard.py --help
